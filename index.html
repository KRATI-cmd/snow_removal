<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" />
    <meta
      name="description"
      content="24/7 commercial & residential snow plowing across Canada. Guaranteed 2-hour storm response, GPS fleet tracking and eco-friendly salt management."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Snow Removal Canada | 24/7 Snow Plowing &amp; Ice Control</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 120%, #1b3558 0%, #0a1628 60%);
        color: #e2e8f0;
        font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader .pl-snow {
        position: absolute;
        inset: -200px 0 0;
        background-image: radial-gradient(2px 2px at 20px 30px, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 90px 120px, #fff 50%, transparent 51%),
          radial-gradient(2.5px 2.5px at 150px 60px, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 60px 170px, #fff 50%, transparent 51%),
          radial-gradient(2px 2px at 180px 180px, #fff 50%, transparent 51%);
        background-size: 200px 200px;
        opacity: 0.55;
        animation: pl-fall 6s linear infinite;
      }
      #preloader .pl-box {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #preloader .pl-logo {
        width: 76px;
        height: 76px;
        filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.35));
      }
      #preloader .pl-flake {
        transform-origin: 32px 26px;
        animation: pl-spin 3.2s linear infinite;
      }
      #preloader .pl-name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #preloader .pl-name span {
        color: #38bdf8;
      }
      #preloader .pl-bar {
        position: relative;
        width: 220px;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
      }
      #preloader .pl-cleared {
        position: absolute;
        inset: 0 auto 0 0;
        background: #1e293b;
        animation: pl-clear 1.8s ease-in-out infinite;
      }
      #preloader .pl-blade {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 8px;
        margin-left: -8px;
        border-radius: 2px;
        background: #f97316;
        box-shadow: 0 0 10px rgba(249, 115, 22, 0.9);
        animation: pl-plow 1.8s ease-in-out infinite;
      }
      #preloader .pl-text {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      @keyframes pl-fall { to { transform: translateY(200px); } }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-clear { from { width: 0; } to { width: 100%; } }
      @keyframes pl-plow { from { left: 0; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #preloader * { animation: none !important; }
        #preloader .pl-cleared { width: 60%; }
        #preloader .pl-blade { left: 60%; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading Snow Removal Canada">
      <div class="pl-snow"></div>
      <div class="pl-box">
        <svg class="pl-logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="pl-bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1e3a5f" />
              <stop offset="1" stop-color="#0f172a" />
            </linearGradient>
            <g id="pl-arm" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="32" y1="26" x2="32" y2="10" />
              <polyline points="26.5,12.5 32,18 37.5,12.5" />
            </g>
          </defs>
          <rect width="64" height="64" rx="15" fill="url(#pl-bg)" />
          <g class="pl-flake">
            <use href="#pl-arm" />
            <use href="#pl-arm" transform="rotate(60 32 26)" />
            <use href="#pl-arm" transform="rotate(120 32 26)" />
            <use href="#pl-arm" transform="rotate(180 32 26)" />
            <use href="#pl-arm" transform="rotate(240 32 26)" />
            <use href="#pl-arm" transform="rotate(300 32 26)" />
          </g>
          <path d="M9 47 Q32 60 55 47 L55 53 Q32 66 9 53 Z" fill="#f97316" />
        </svg>
        <div class="pl-name">Snow Removal <span>Canada</span></div>
        <div class="pl-bar"><div class="pl-cleared"></div><div class="pl-blade"></div></div>
        <div class="pl-text">Clearing the way…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
